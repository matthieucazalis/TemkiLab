services:
  db:
    image: postgres:16-alpine
    container_name: temkilab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temkilab
      POSTGRES_PASSWORD: temkilab_dev
      POSTGRES_DB: temkilab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
